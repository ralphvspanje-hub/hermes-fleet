[project]
name = "home-hunt"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12"]

[project.optional-dependencies]
live = ["requests>=2.31", "anthropic>=0.40", "mcp>=1.0"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["home_hunt", "home_hunt.sources", "home_hunt.email_parsers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
